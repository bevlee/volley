apiVersion: apps/v1
kind: Deployment
metadata:
  name: volley
  namespace: volley
  labels:
    app: volley
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: volley
  template:
    metadata:
      labels:
        app: volley
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: volley
          # Bare artifact name so Skaffold rewrites it to the tag it builds.
          image: docker.io/bevdev1/volley
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ORIGIN
              value: https://volley.bevsoft.com
            # The client's address for the upload rate limit: the last hop Traefik adds.
            - name: ADDRESS_HEADER
              value: X-Forwarded-For
            - name: XFF_DEPTH
              value: "1"
            # No PGHOST: games are kept in memory until the database is set up. Then add PGHOST
            # (<service>.db.svc.cluster.local), PGDATABASE (volley), and PGUSER / PGPASSWORD from
            # the Secret mirrored into this namespace.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Measured in the container: about 80 MiB after a game (Node plus tsx).
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            # Writable scratch space under a read-only root (tsx's compile cache).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
