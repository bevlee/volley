# Single-host cert: letsencrypt-prod solves http01, which can't issue wildcards.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: volley
  namespace: volley
spec:
  commonName: volley.bevsoft.com
  dnsNames:
    - volley.bevsoft.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: volley-tls
